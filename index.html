<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Neon Rush — بازی مسابقه‌ای</title>
<style>
  :root{
    --bg-deep:#0a0118;
    --bg-mid:#150a2e;
    --road:#1b0f36;
    --neon-cyan:#0ff0fc;
    --neon-magenta:#ff2ee6;
    --neon-amber:#ffb020;
    --neon-lime:#9dff2e;
    --text:#eae6ff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;min-height:100dvh;
    background:radial-gradient(ellipse at 50% 0%, var(--bg-mid), var(--bg-deep) 70%);
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    color:var(--text);
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    -webkit-user-select:none;user-select:none;
    padding:10px;
  }
  #wrap{
    position:relative;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    width:100%;
    max-width:460px;
  }
  h1{
    margin:0;
    font-size:clamp(18px, 5vw, 28px);
    letter-spacing:6px;
    font-weight:900;
    color:var(--neon-cyan);
    text-shadow:0 0 8px var(--neon-cyan), 0 0 24px var(--neon-magenta);
    animation: flicker 4s infinite;
  }
  @keyframes flicker{
    0%,19%,21%,23%,25%,54%,56%,100%{opacity:1;}
    20%,24%,55%{opacity:.78;}
  }
  #canvasWrap{
    position:relative;
    width:100%;
    max-width:420px;
    aspect-ratio:420/620;
  }
  #gameCanvas{
    display:block;
    width:100%;
    height:100%;
    border-radius:14px;
    box-shadow:0 0 0 2px rgba(15,240,252,.25), 0 0 40px rgba(255,46,230,.25), 0 20px 60px rgba(0,0,0,.6);
    background:var(--road);
  }
  #hud{
    position:absolute;top:56px;left:0;right:0;
    display:flex;justify-content:space-between;
    padding:0 18px;
    pointer-events:none;
    font-weight:700;
    font-size:15px;
    letter-spacing:1px;
  }
  .hud-box{
    background:rgba(10,1,24,.55);
    border:1px solid rgba(15,240,252,.35);
    padding:6px 14px;
    border-radius:8px;
    text-shadow:0 0 6px rgba(15,240,252,.6);
  }
  #overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;
    background:rgba(5,0,15,.72);
    border-radius:14px;
    text-align:center;
    padding:20px;
  }
  #overlay h2{
    margin:0;
    font-size:26px;
    color:var(--neon-magenta);
    text-shadow:0 0 10px var(--neon-magenta);
  }
  #overlay p{margin:0;color:#c9c2f0;font-size:14px;max-width:280px;line-height:1.6;}
  button{
    margin-top:6px;
    padding:10px 26px;
    border-radius:999px;
    border:2px solid var(--neon-cyan);
    background:linear-gradient(90deg, rgba(15,240,252,.15), rgba(255,46,230,.15));
    color:var(--text);
    font-size:15px;font-weight:800;letter-spacing:2px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button:hover{
    transform:translateY(-2px) scale(1.04);
    box-shadow:0 0 18px var(--neon-cyan);
  }
  #hint{
    font-size:12px;color:#8b81b8;letter-spacing:1px;
  }
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="wrap">
  <h1>NEON RUSH</h1>
  <div id="canvasWrap">
    <canvas id="gameCanvas" width="420" height="620"></canvas>
    <div id="hud">
      <div class="hud-box">امتیاز: <span id="score">0</span></div>
      <div class="hud-box">سرعت: <span id="speed">0</span></div>
    </div>
    <div id="overlay">
      <h2>NEON RUSH</h2>
      <p>با کلیدهای چپ/راست (یا ← →) یا لمس صفحه، ماشینتو بین لاین‌ها هدایت کن و از برخورد با ماشین‌های دیگه فرار کن. هرچی بیشتر دووم بیاری، سرعت بیشتر میشه!</p>
      <button id="startBtn">شروع مسابقه</button>
      <div id="hint">کلید فاصله = مکث</div>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scoreEl = document.getElementById('score');
  const speedEl = document.getElementById('speed');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  const LANES = 3;
  const laneWidth = W * 0.72 / LANES;
  const roadLeft = W * 0.14;
  const roadRight = roadLeft + laneWidth * LANES;

  function laneX(lane){ return roadLeft + laneWidth * (lane + 0.5); }

  let state = 'menu'; // menu | playing | paused | over
  let player, traffic, particles, dashOffset, baseSpeed, speed, distance, spawnTimer, shake, lastTime;

  function reset(){
    player = { lane: 1, x: laneX(1), y: H - 110, w: 42, h: 70, targetX: laneX(1) };
    traffic = [];
    particles = [];
    dashOffset = 0;
    baseSpeed = 4.2;
    speed = baseSpeed;
    distance = 0;
    spawnTimer = 0;
    shake = 0;
    lastTime = performance.now();
  }

  function spawnCar(){
    const lane = Math.floor(Math.random() * LANES);
    const palette = ['#ff2ee6', '#ffb020', '#9dff2e', '#0ff0fc'];
    traffic.push({
      lane, x: laneX(lane), y: -100, w: 40, h: 68,
      color: palette[Math.floor(Math.random()*palette.length)]
    });
  }

  function spawnParticle(x, y, color){
    particles.push({
      x, y, vx: (Math.random()-0.5)*2, vy: Math.random()*2+2,
      life: 1, color
    });
  }

  function roundedRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawCar(cx, cy, w, h, color, glowColor){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.shadowColor = glowColor || color;
    ctx.shadowBlur = 18;
    // body
    ctx.fillStyle = color;
    roundedRect(-w/2, -h/2, w, h, 10);
    ctx.fill();
    // windshield
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(10,1,24,0.65)';
    roundedRect(-w/2+7, -h/2+10, w-14, h*0.32, 6);
    ctx.fill();
    // headlight / taillight strips
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(-w/2+5, -h/2+2, w-10, 3);
    ctx.restore();
  }

  function update(dt){
    distance += speed * dt * 0.06;
    speed = baseSpeed + Math.min(distance / 90, 7);

    // player glide toward target lane
    player.x += (player.targetX - player.x) * Math.min(1, dt*0.012);

    // exhaust particles
    if (Math.random() < 0.6) spawnParticle(player.x + (Math.random()-0.5)*14, player.y + player.h/2, 'rgba(15,240,252,0.8)');

    // dash lines
    dashOffset += speed * dt * 0.06;

    // spawn traffic
    spawnTimer -= dt;
    const spawnInterval = Math.max(420, 900 - distance*1.5);
    if (spawnTimer <= 0){
      spawnCar();
      spawnTimer = spawnInterval + Math.random()*300;
    }

    // move traffic
    for (const c of traffic){
      c.y += speed * dt * 0.09;
    }
    traffic = traffic.filter(c => c.y < H + 100);

    // collisions
    for (const c of traffic){
      if (Math.abs(c.lane - player.lane) === 0 && Math.abs(c.y - player.y) < (c.h+player.h)/2 - 14){
        crash();
        return;
      }
    }

    // particles
    for (const p of particles){
      p.x += p.vx; p.y += p.vy; p.life -= dt*0.003;
    }
    particles = particles.filter(p => p.life > 0);

    if (shake > 0) shake *= 0.9;

    scoreEl.textContent = Math.floor(distance);
    speedEl.textContent = Math.floor(speed*38);
  }

  function crash(){
    state = 'over';
    shake = 18;
    for (let i=0;i<26;i++) spawnParticle(player.x, player.y, Math.random()<0.5 ? '#ff2ee6' : '#ffb020');
    showOverlay('برخورد کردی! 💥', `امتیاز نهایی: ${Math.floor(distance)}`, 'دوباره امتحان کن');
  }

  function drawRoad(){
    ctx.fillStyle = '#150a2e';
    ctx.fillRect(0,0,W,H);

    // road base
    ctx.fillStyle = '#1b0f36';
    ctx.fillRect(roadLeft, 0, laneWidth*LANES, H);

    // roadside neon edges
    ctx.save();
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#0ff0fc';
    ctx.strokeStyle = '#0ff0fc';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(roadLeft,0); ctx.lineTo(roadLeft,H); ctx.stroke();
    ctx.shadowColor = '#ff2ee6';
    ctx.strokeStyle = '#ff2ee6';
    ctx.beginPath(); ctx.moveTo(roadRight,0); ctx.lineTo(roadRight,H); ctx.stroke();
    ctx.restore();

    // lane dashes
    ctx.strokeStyle = 'rgba(234,230,255,0.5)';
    ctx.lineWidth = 3;
    ctx.setLineDash([26, 24]);
    for (let i=1;i<LANES;i++){
      const x = roadLeft + laneWidth*i;
      ctx.beginPath();
      ctx.lineDashOffset = -dashOffset;
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  function draw(){
    ctx.save();
    if (shake > 0.3){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }
    drawRoad();

    for (const p of particles){
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3.2, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const c of traffic){
      drawCar(c.x, c.y, c.w, c.h, c.color);
    }

    if (state !== 'over'){
      drawCar(player.x, player.y, player.w, player.h, '#ffffff', '#0ff0fc');
    }

    ctx.restore();
  }

  let raf;
  function loop(now){
    const dt = Math.min(now - lastTime, 40);
    lastTime = now;
    if (state === 'playing') update(dt);
    draw();
    raf = requestAnimationFrame(loop);
  }

  function showOverlay(title, desc, btnText){
    overlay.classList.remove('hidden');
    overlay.querySelector('h2').textContent = title;
    overlay.querySelector('p').textContent = desc;
    startBtn.textContent = btnText;
  }

  function hideOverlay(){
    overlay.classList.add('hidden');
  }

  function startGame(){
    reset();
    state = 'playing';
    hideOverlay();
  }

  function moveLane(dir){
    if (state !== 'playing') return;
    player.lane = Math.max(0, Math.min(LANES-1, player.lane + dir));
    player.targetX = laneX(player.lane);
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.code === 'KeyA') moveLane(-1);
    if (e.key === 'ArrowRight' || e.code === 'KeyD') moveLane(1);
    if (e.key === ' '){
      if (state === 'playing') state = 'paused';
      else if (state === 'paused') state = 'playing';
    }
  });

  let touchStartX = null;
  canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
  canvas.addEventListener('touchend', e => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 30) moveLane(dx > 0 ? 1 : -1);
    touchStartX = null;
  });
  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    moveLane(x < W/2 ? -1 : 1);
  });

  startBtn.addEventListener('click', startGame);

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
