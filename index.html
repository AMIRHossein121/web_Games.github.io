<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Neon Arcade — مجموعه بازی‌ها</title>
<style>
  :root{
    --bg-top:#1a0b3d;
    --bg-bottom:#05010f;
    --neon-cyan:#0ff0fc;
    --text:#eae6ff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;height:100%;min-height:100dvh;
    background:radial-gradient(ellipse at 50% 0%, var(--bg-top), var(--bg-bottom) 75%);
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    color:var(--text);
    overflow:hidden;
  }
  #menuView{
    height:100%;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    overflow-y:auto;
  }
  #menuInner{max-width:820px;width:100%;display:flex;flex-direction:column;align-items:center;gap:22px;}
  h1{
    margin:0;font-size:clamp(24px, 6vw, 34px);letter-spacing:8px;font-weight:900;
    color:var(--neon-cyan);
    text-shadow:0 0 10px var(--neon-cyan), 0 0 30px #ff2ee6;
    animation:flicker 4s infinite;
  }
  @keyframes flicker{
    0%,19%,21%,23%,25%,54%,56%,100%{opacity:1;}
    20%,24%,55%{opacity:.78;}
  }
  p.sub{ margin:0; color:#a89fd6; font-size:13px; letter-spacing:1px; text-align:center; }
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
    gap:16px;
    width:100%;
  }
  .card{
    display:flex;flex-direction:column;gap:8px;
    background:linear-gradient(135deg, rgba(27,15,54,.9), rgba(16,8,38,.9));
    border:2px solid rgba(15,240,252,.25);
    border-radius:16px;
    padding:18px;
    cursor:pointer;
    color:var(--text);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .card:hover, .card:active{
    transform:translateY(-3px);
    box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 22px var(--accent, var(--neon-cyan));
    border-color:var(--accent, var(--neon-cyan));
  }
  .icon{ font-size:32px; }
  .title{ font-size:17px; font-weight:800; letter-spacing:1px; color:var(--accent, var(--neon-cyan)); text-shadow:0 0 8px var(--accent, var(--neon-cyan)); }
  .desc{ font-size:12px; color:#bdb4e8; line-height:1.6; }
  footer{ font-size:11px; color:#6c6394; letter-spacing:1px; margin-top:6px; text-align:center; }

  #gameView{
    display:none;
    height:100%;height:100dvh;
    flex-direction:column;
  }
  #gameView.active{ display:flex; }
  #menuView.hidden{ display:none; }
  #topBar{
    display:flex;align-items:center;gap:12px;
    padding:calc(8px + env(safe-area-inset-top)) 14px 8px 14px;
    background:rgba(10,1,24,.9);
    border-bottom:1px solid rgba(15,240,252,.25);
    flex-shrink:0;
  }
  #backBtn{
    padding:7px 16px;border-radius:999px;border:2px solid var(--neon-cyan);
    background:rgba(15,240,252,.1);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  #backBtn:hover{ box-shadow:0 0 14px rgba(15,240,252,.5); }
  #gameTitle{ font-size:14px; font-weight:800; letter-spacing:1px; color:var(--neon-cyan); }
  #gameFrame{ flex:1; width:100%; border:none; background:#05010f; }

  @media (min-width:900px){
    #menuInner{ max-width:900px; }
    .card{ padding:22px; }
  }
</style>
</head>
<body>

<div id="menuView">
  <div id="menuInner">
    <h1>NEON ARCADE</h1>
    <p class="sub">مجموعه بازی‌های وب</p>
    <div id="grid">
    <div class="card" style="--accent:#0ff0fc" onclick="openGame('rush')">
      <div class="icon">🏎️</div>
      <div class="title">Neon Rush</div>
      <div class="desc">مسابقه رانندگی</div>
    </div>
    <div class="card" style="--accent:#9dff2e" onclick="openGame('runner')">
      <div class="icon">🏃</div>
      <div class="title">Sky Runner</div>
      <div class="desc">دونده بی‌پایان</div>
    </div>
    <div class="card" style="--accent:#b06bff" onclick="openGame('memory')">
      <div class="icon">🃏</div>
      <div class="title">Neon Memory</div>
      <div class="desc">بازی حافظه</div>
    </div>
    <div class="card" style="--accent:#ffb020" onclick="openGame('cps')">
      <div class="icon">⚡</div>
      <div class="title">Neon CPS Test</div>
      <div class="desc">تست سرعت کلیک</div>
    </div>
    <div class="card" style="--accent:#ff2ee6" onclick="openGame('type')">
      <div class="icon">⌨️</div>
      <div class="title">Neon Type Race</div>
      <div class="desc">مسابقه تایپ</div>
    </div>
    </div>
  </div>
</div>

<div id="gameView">
  <div id="topBar">
    <button id="backBtn" onclick="closeGame()">‹ بازگشت به منو</button>
    <span id="gameTitle"></span>
  </div>
  <iframe id="gameFrame"></iframe>
</div>

  };
  const TITLES = {
    rush: "Neon Rush", runner: "Sky Runner", memory: "Neon Memory",
    cps: "Neon CPS Test", type: "Neon Type Race"
  };

  function openGame(key){
    const b64 = GAMES[key];
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const frame = document.getElementById('gameFrame');
    frame.src = url;
    frame.onload = () => { try { frame.contentWindow.focus(); } catch(e) {} };
    document.getElementById('gameTitle').textContent = TITLES[key];
    document.getElementById('menuView').classList.add('hidden');
    document.getElementById('gameView').classList.add('active');
  }

  function closeGame(){
    document.getElementById('gameView').classList.remove('active');
    document.getElementById('menuView').classList.remove('hidden');
    document.getElementById('gameFrame').src = 'about:blank';
  }
</script>
